name: ahmad_rest_cafe
description: "Ahmad Rest & Cafe - Luxury Fine Dining Experience App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization
  intl: ^0.19.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Storage
  shared_preferences: ^2.2.3

  # Fonts & UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

  # Routing
  go_router: ^14.2.0

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Images
  cached_network_image: ^3.3.1

  # Icons
  flutter_svg: ^2.0.10+1

  # App metadata (version shown in Settings)
  package_info_plus: ^8.0.0

  # Profile picture selection (camera / gallery)
  image_picker: ^1.1.2

  # Social sign-in
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1

  # Firebase backend (Auth + Firestore + Storage)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # Push notifications
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # Payments
  flutter_stripe: ^11.3.0
  cloud_functions: ^5.1.3

  # Connectivity (offline banner)
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0A0A0A"
  image: "assets/icon/app_icon_foreground.png"
  android_12:
    image: "assets/icon/app_icon_foreground.png"
    icon_background_color: "#0A0A0A"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icon/

  # يمكن إضافة خطوط مخصصة لاحقًا مثل Playfair Display / Cormorant
  # fonts:
  #   - family: PlayfairDisplay
  #     fonts:
  #       - asset: assets/fonts/PlayfairDisplay-Regular.ttf
  #       - asset: assets/fonts/PlayfairDisplay-Bold.ttf
  #         weight: 700
